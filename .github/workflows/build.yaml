name: Build SoulsyHUD
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always
    VCPKG_COMMIT_ID: 9edb1b8e590cc086563301d735cae4b6e732d2d2
    CMAKE_BUILD_TYPE: Release

jobs:
    compile:
        name: build plugin
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v3
              with:
                  submodules: recursive
            - uses: actions/cache@v3
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                      build
                      vcpkg-installed
                  key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-
                      ${{ runner.os }}-
            - uses: ilammy/msvc-dev-cmd@v1.10.0
            - uses: lukka/run-vcpkg@v11.1
              with:
                  vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

            - name: build the the DLL
              uses: lukka/run-cmake@v10.0
              with:
                  cmakeListsTxtPath: CMakeLists.txt
                  configurePreset: "vs2022-windows"
                  buildPreset: "vs2022-windows"
                  buildPresetCmdString: "['--build', '--preset', '$[env.BUILD_PRESET_NAME]', '--config', 'Release']"

            - name: package compatibility patch
              shell: pwsh
              run: |
                  python scripts/package_patch.py --build-dir build/Release --output-dir releases

            - name: create a tagged release and upload the patch archive
              uses: ncipollo/release-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  name: SoulsyHUD ${{ github.ref_name }} (Skyrim 1.7.104.0 Patch)
                  tag: ${{ github.ref_name }}
                  draft: true
                  artifacts: "releases/*.zip"
